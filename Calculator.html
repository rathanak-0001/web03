<!DOCTYPE html>
<html>

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
*{
margin:0;
padding:0;
box-sizing:border-box;
}  

body{
background:#EEEEEE; 
font-family: 'poppins', sans-serif;
}

.container{
padding:25px;  
width:340px;
border-radius:7px;
background:#393939;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.container .title{
text-align:center;
font-size:15px;
color:white;
}

.container .result-box{
height:80px;   
margin-top:5px;
}

.container .result-box input{
all:unset;   
height:60px;
width:250px;
color:white;
font-size:35px;
float:right;
margin-top:20px;
text-align:right;
font-weight:600;
}

.container .btns-box{
margin-top:15px;
border-top:.5px solid white;
padding:-3px;
}

.container .btns-box button{
all:unset;    
height:60px;
width:60px;
background:#272727;
border-radius:3px;
color:white;
display:flex;
align-items:center;
justify-content:center;
float:left;
margin-left:12px;
margin-top:15px;
position:relative;
left:-5px;
cursor:pointer;
font-size:17px;
}

.container .btns-box .eval-btn{
background:#E50027;        
}

.container .btns-box .color-btn{
color:#E50027;  
}
</style>       
</head>

<body>
<div class="container">
    <h3 class="title">Calculator</h3>    
  <div class="result-box">
      <input type="text" class="input" placeholder="0" readonly>   
  </div>   
  <div class="btns-box">
     <button class="clr-btn color-btn">AC</button>  
     <button class="delete-btn color-btn">DE</button>     
     <button class="btn color-btn">%</button>     
     <button class="btn color-btn">÷</button> 
     <button class="btn">7</button>     
     <button class="btn">8</button>     
     <button class="btn">9</button>     
     <button class="btn color-btn">×</button>   
     <button class="btn">4</button>     
     <button class="btn">5</button>     
     <button class="btn">6</button>     
     <button class="btn color-btn">-</button> 
     <button class="btn">1</button>     
     <button class="btn">2</button>     
     <button class="btn">3</button>     
     <button class="btn color-btn">+</button>  
     <button class="btn">.</button>     
     <button class="btn">0</button>     
     <button class="btn">00</button>  
     <button class="eval-btn">=</button>     
  </div>
</div>
<script>
let result = document.querySelector('.container .result-box input');
let btns = document.querySelectorAll('.container .btns-box .btn');
let evalBtn = document.querySelector('.container .btns-box .eval-btn');
let clrBtn = document.querySelector('.container .btns-box .clr-btn');
let delBtn = document.querySelector('.container .btns-box .delete-btn');

let getValue =(e)=>{
  let btnText = e.target.innerHTML;
  if(btnText == '×'){
     btnText = '*'    
  }
  if(btnText == '÷'){
     btnText = '/';   
  }
  result.value += btnText;
}

evalBtn.addEventListener('click',()=>{
 try{
   result.value = eval(result.value);   
 }catch(err){
   result.value = 'Error';    
 }    
})

clrBtn.addEventListener('click',()=>{
  result.value = '';     
});

delBtn.addEventListener('click',()=>{
  result.value = result.value.substr(0,result.value.length - 1);
})

for(let i=0;i<btns.length;i++){
  btns[i].addEventListener('click',getValue)  
}
</script>
</body>

</html>
